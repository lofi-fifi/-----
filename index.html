<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FFFFFF" />
    <!-- 移动端优先：支持「添加到主屏幕」（iOS 读 apple-*，Android 读 manifest） -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="考研打卡" />
    <title>考研打卡</title>

    <!--
      在 React 挂载之前先把主题定下来。
      没有这段的话，选了深色的用户每次刷新都会先看到一闪的白屏。
      必须内联在这里 —— 走打包会晚一步，闪屏就回来了。
    -->
    <script>
      ;(function () {
        try {
          var mode = localStorage.getItem('kaoyan-theme')
          if (mode !== 'light' && mode !== 'dark') {
            mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.setAttribute('data-theme', mode)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', mode === 'dark' ? '#0B0B0B' : '#FFFFFF')
        } catch (error) {
          /* 读不到就走默认的浅色，不影响功能 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
