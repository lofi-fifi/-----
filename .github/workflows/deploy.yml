name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 也可以在 Actions 页面手动点按钮触发
  workflow_dispatch:

# GITHUB_TOKEN 需要的权限：读取代码 + 写入 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新的推送会取消正在排队的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建
        run: pnpm build
        env:
          # GitHub Pages 是子路径部署（https://<用户名>.github.io/<仓库名>/），
          # 必须把仓库名告诉 Vite，否则资源路径会全部 404
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
